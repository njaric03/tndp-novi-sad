# ablacija: self-critical baseline (greedy rollout, Kool et al.) umesto
# naucene value glave. oba su implementirana, nikad nisu uporedjena
iters: 3000
batch: 16
n_range: [15, 30]
num_routes: 4
demand_mode: gravity
eval_every: 100
eval_cities: 16
baseline: greedy
alpha_eval: 0.5
# pinovano: tabele pod ovim imenom su pravljene sa lr 1e-4, pre nego sto je
# default podignut na 1e-3. bez ovoga bi im se znacenje tiho promenilo.
lr: 0.0001
