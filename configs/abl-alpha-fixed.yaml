# ablacija: alpha zakljucan na 0.5 umesto uzorkovanja.
# pitanje: koliko se gubi na alpha=0.5 kad se politika trenira samo na njoj,
# i da li uslovljavanje na alpha uopste nesto kosta
iters: 3000
batch: 16
n_range: [15, 30]
num_routes: 4
demand_mode: gravity
eval_every: 100
eval_cities: 16
alpha_fixed: 0.5
alpha_eval: 0.5
# pinovano: tabele pod ovim imenom su pravljene sa lr 1e-4, pre nego sto je
# default podignut na 1e-3. bez ovoga bi im se znacenje tiho promenilo.
lr: 0.0001
