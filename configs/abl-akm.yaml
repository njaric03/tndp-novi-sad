# ablacija: featuri iz analize kompleksnih mreza. Sve isto kao gravity-v1,
# menja se samo skup ulaznih featura, pa je razlika u rezultatu pripisiva
# njima i nicemu drugom.
#
# v2 dodaje prolaznost (betweenness ponderisan traznjom), koreness (k-core) i
# bliskost, i menja skaliranje stepena iz deljenja konstantom u rang
# transformaciju. Prve dve su GLOBALNE velicine koje tri GATv2 sloja ne mogu
# da izracunaju jer im je receptivno polje tri skoka; treca popravlja
# raspodelu ulaza izmedju instanci, iz istog razloga zbog kog traznja ide kroz
# rang transformaciju.
iters: 3000
batch: 16
n_range: [15, 30]
num_routes: 4
demand_mode: gravity
eval_every: 100
eval_cities: 16
alpha_eval: 0.5
features: v2
# pinovano: tabele pod ovim imenom su pravljene sa lr 1e-4, pre nego sto je
# default podignut na 1e-3. bez ovoga bi im se znacenje tiho promenilo.
lr: 0.0001
