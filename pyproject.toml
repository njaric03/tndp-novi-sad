[project]
name = "tndp"
version = "0.1.0"
description = "GNN + RL za Transit Network Design Problem, case study Novi Sad (seminarski rad)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
# RL faza (model i trening). Verzije su ograničene namerno: redovi `RL sampling`
# u results/ zavise od toga koja od 32 uzorkovane epizode ispadne najbolja, a taj
# izbor ume da se prevrne na razliku u poslednjim bitovima GATv2 izlaza. Tačne
# verzije kojima su tabele napravljene stoje u README-u.
rl = [
    "torch>=2.5,<3",
    "torch-geometric>=2.6,<3",
]
# Novi Sad pipeline (geo podaci); gtfs-kit nema šta da radi jer GTFS za Novi Sad
# ne postoji, pa se red vožnje i trase skidaju sa GSP/NSmart portala (tndp/novisad/preuzmi.py)
geo = [
    "requests",
    "osmnx",
    "h3",
    "geopandas",
    "shapely",
    "folium",
]
dev = [
    "pytest",
]
# notebooks/ prikazuju rezultate; paket radi i bez ovoga
nb = [
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tndp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
